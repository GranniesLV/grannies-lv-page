<!doctype html>
<html lang="lv" data-bs-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
    content="Jaunākās ziņas, notikumi un Trešās paaudzes universitātes aktivitātes biedrībā Vecmāmiņas.lv.">
  <title>Aktualitātes | Vecmāmiņas.lv</title>
  <link rel="icon" type="image/x-icon" href="../assets/images/icons/favicon.ico">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="lv_LV">
  <meta property="og:url" content="https://vecmaminas.lv/pages/topicality.html">
  <meta property="og:title" content="Aktualitātes | Vecmāmiņas.lv">
  <meta property="og:description"
    content="Jaunākās ziņas, notikumi un Trešās paaudzes universitātes aktivitātes biedrībā Vecmāmiņas.lv.">
  <meta property="og:image" content="https://vecmaminas.lv/assets/images/logos/granniesLogo.png">

  <link rel="stylesheet" href="../assets/css/bootstrap.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>

  <!-- HEADER -->
  <div id="header"></div>

  <main class="container">

    <!--^ Aktualitātes, Main bilde, apakš navigācijas josla -->
    <div class="mb-5">
      <img class="img-fluid mb-5 d-block mx-auto"
        src="/assets/images/topicality/update-theme.jpeg"
        alt="Update theme"
        title="Photo from https://www.themely.com/category/updates/">
      <h1>Aktualitātes</h1>

      <nav class="navbar navbar-expand-lg bg-body-tertiary rounded" aria-label="Twelfth navbar example">
        <div class="container-fluid">
          <div class="navbar-collapse justify-content-md-center" id="navbarsExample10">
            <ul class="navbar-nav">

              <li class="nav-item">
                <a class="nav-link" href="../pages/topicality.html#news">
                  Jaunumi</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="../pages/topicality.html#events">
                  Notikumi</a>
              </li>

              <li class="nav-item">
                <a class="nav-link" href="../pages/topicality.html#university">
                  Trešās paaudzes universitāte</a>
              </li>

            </ul>
          </div>
        </div>
      </nav>
    </div>

    <!--^ Jaunumi -->
    <div id="news" class="container mt-5">
      <h1 class="mb-5">Jaunumi</h1>
      <div id="topicality-news-container"></div>
    </div>
    <hr>

    <!--^ Notikumi -->
    <div id="events" class="text-center mb-5">
      <h1>Notikumi</h1>

      <!--~ Notikumu meklēšana -->
      <div class="mx-auto mb-3 position-relative" style="max-width: 420px;">
        <input type="search" id="events-search-input" class="form-control rounded-pill" autocomplete="off"
          placeholder="🔍 Meklēt notikumu (nosaukums vai datums)...">
        <div id="events-search-suggestions" class="list-group position-absolute w-100 shadow-sm text-start"
          style="z-index: 10; display: none;"></div>
      </div>

      <!--~ Notikumu pogas (5 jaunākās) -ģenerē topicality.js no topicalityEvents masīva -->
      <div id="topicality-events-btns-container" class="event-btns mb-2"></div>

      <!--~ Pārējās notikumu pogas -paslēptas, kamēr neatver/nemeklē -->
      <div id="topicality-events-btns-more-container" class="event-btns collapse mb-3"></div>

      <button class="btn btn-outline-secondary btn-sm rounded-pill mb-5" type="button"
        data-bs-toggle="collapse" data-bs-target="#topicality-events-btns-more-container"
        aria-expanded="false" aria-controls="topicality-events-btns-more-container"
        id="topicality-events-toggle-btn">
        Rādīt visus notikumus
      </button>

      <div id="topicality-events-container"></div>
    </div>
    <hr>

    <!--^ "Trešās paaudzes universitāte" -->
    <div id="university" class="my-5">
      <h1>Trešās paaudzes universitāte</h1>

      <div id="myCarousel" class="carousel slide mb-6" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active" aria-label="Slide 1"
            aria-current="true"></button>
          <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1" aria-label="Slide 2"
            class=""></button>
          <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2" aria-label="Slide 3"
            class=""></button>
        </div>
        <div class="carousel-inner">

          <div class="carousel-item active">
            <img class="bd-placeholder-img" width="100%" height="25%"
              src="https://images.pexels.com/photos/159711/books-bookstore-book-reading-159711.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2"
              alt="library">
          </div>

          <div class="carousel-item">
            <img class="bd-placeholder-img" width="100%" height="25%"
              src="https://images.pexels.com/photos/1370295/pexels-photo-1370295.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2"
              alt="library">
          </div>

          <div class="carousel-item">
            <img class="bd-placeholder-img" width="100%" height="25%"
              src="https://images.pexels.com/photos/207662/pexels-photo-207662.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2"
              alt="library">
          </div>

        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

      <div id="topicality-university-container"></div>

    </div>

  </main>

  <!-- FOOTER -->
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script type="module" src="../assets/js/main.js"></script>


  <!-- GoatCounter apmeklējumu statistika (bez sīkdatnēm) -->
  <script data-goatcounter="https://vecmaminas.goatcounter.com/count"
    async src="//gc.zgo.at/count.js"></script>

</body>

</html>
